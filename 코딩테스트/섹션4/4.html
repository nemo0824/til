<html>
  <head>
    <meta charset="UTF-8" />
    <title>졸업선물</title>
  </head>
  <body>
    <script>
      function solution(m, arr) {
        let count = 0;
        let sorted = arr.sort((a, b) => a[0] / 2 + a[1] - (b[0] / 2 + b[1]));
        for (let i = 0; i < arr.length; i++) {
          if (m - (sorted[i][0] / 2 + sorted[i][1]) > 0) {
            m = m - (sorted[i][0] / 2 + sorted[i][1]);
            count++;
          }
        }
        return count;
      }
      // 학생수
      let n = 5;
      // 예산
      let m = 28;
      // 상품가격, 배송비
      let arr = [
        [6, 6], // 9
        [2, 2], // 3
        [4, 3], /// 5
        [4, 5], // 7
        [10, 3], // 8
      ];

      //1. 할인받을 상품을 /2 로하고 + 배송비 한것과 나머지것들을 오름차순으로 정렬한다
      //2. 그러면 상품의 갯수만큼 반복문을 돌리는것
      //3. 그떄 예산에서 빼는데 에산이 마이너스가 되기전까지 count숫자를 센다?
      console.log(solution(m, arr));
    </script>
  </body>
</html>
