<html>
  <head>
    <meta charset="UTF-8" />
    <title>자릿수의 합</title>
  </head>
  <body>
    <script>
      // 1. 만약 자리수의 합이 같을경우 실제 값이 더 큰게 이긴다
      function solution(arr) {
        let max = { sum: 0, value: arr[0] };

        for (let i = 0; i < arr.length; i++) {
          let sum = arr[i]
            .toString()
            .split("")
            .reduce((acc, cur) => acc + Number(cur), 0);
          if (max.sum < sum) max = { sum, value: arr[i] };

          if (max.sum === sum) {
            if (max.value < arr[i]) {
              max = { sum, value: arr[i] };
            }
          }
        }
      }

      let arr = [128, 460, 603, 40, 521, 137, 123];
      console.log(solution(arr));
    </script>
  </body>
</html>
